<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" fill="none">
  <title>Acid maximalist Memphis pattern</title>
  <desc>Transparent repeating decorative pattern with sparse black squiggles, checker fragments, cobalt dots, coral triangles, yellow zigzags, and lavender striped circles.</desc>
  <defs>
    <pattern id="memphis" x="0" y="0" width="800" height="800" patternUnits="userSpaceOnUse">
      <g stroke-linecap="round" stroke-linejoin="round">
        <!-- black squiggles -->
        <path d="M62 122c18-27 35 31 52 4s34-23 49 8 34 17 45-11" stroke="#111" stroke-width="9"/>
        <path d="M618 138c19-28 37 29 54 2s35-22 51 9 35 17 47-12" stroke="#111" stroke-width="9"/>
        <path d="M65 672c19-28 36 30 53 3s35-23 50 8 34 17 46-11" stroke="#111" stroke-width="9"/>
        <path d="M610 684c18-27 35 31 52 4s34-23 49 8 34 17 45-11" stroke="#111" stroke-width="9"/>

        <!-- checkerboard fragments -->
        <g transform="translate(155 42) rotate(-10)">
          <rect width="84" height="56" fill="#fff" stroke="#111" stroke-width="4"/>
          <path d="M0 0h28v28H0zM56 0h28v28H56zM28 28h28v28H28z" fill="#111" stroke="none"/>
        </g>
        <g transform="translate(568 44) rotate(9)">
          <rect width="76" height="52" fill="#fff" stroke="#111" stroke-width="4"/>
          <path d="M0 0h26v26H0zM52 0h24v26H52zM26 26h26v26H26z" fill="#111" stroke="none"/>
        </g>
        <g transform="translate(120 706) rotate(8)">
          <rect width="78" height="54" fill="#fff" stroke="#111" stroke-width="4"/>
          <path d="M0 0h27v27H0zM51 0h27v27H51zM27 27h24v27H27z" fill="#111" stroke="none"/>
        </g>
        <g transform="translate(617 708) rotate(-8)">
          <rect width="82" height="56" fill="#fff" stroke="#111" stroke-width="4"/>
          <path d="M0 0h28v28H0zM54 0h28v28H54zM28 28h26v28H28z" fill="#111" stroke="none"/>
        </g>

        <!-- cobalt dots -->
        <circle cx="52" cy="300" r="14" fill="#2455ff" stroke="#111" stroke-width="3"/>
        <circle cx="92" cy="336" r="7" fill="#2455ff" stroke="#111" stroke-width="3"/>
        <circle cx="744" cy="292" r="15" fill="#2455ff" stroke="#111" stroke-width="3"/>
        <circle cx="707" cy="332" r="8" fill="#2455ff" stroke="#111" stroke-width="3"/>
        <circle cx="42" cy="496" r="9" fill="#2455ff" stroke="#111" stroke-width="3"/>
        <circle cx="758" cy="496" r="10" fill="#2455ff" stroke="#111" stroke-width="3"/>

        <!-- coral triangles -->
        <path d="M50 196l29 48H21z" fill="#ff665f" stroke="#111" stroke-width="4"/>
        <path d="M735 188l30 50h-60z" fill="#ff665f" stroke="#111" stroke-width="4"/>
        <path d="M40 588l32 53H8z" fill="#ff665f" stroke="#111" stroke-width="4"/>
        <path d="M746 576l31 51h-62z" fill="#ff665f" stroke="#111" stroke-width="4"/>

        <!-- yellow zigzags -->
        <path d="M248 30l18 22 18-22 18 22 18-22 18 22" stroke="#e7ff27" stroke-width="11" fill="none"/>
        <path d="M472 746l18-22 18 22 18-22 18 22 18-22" stroke="#e7ff27" stroke-width="11" fill="none"/>
        <path d="M26 414l18-22 18 22 18-22" stroke="#e7ff27" stroke-width="10" fill="none"/>
        <path d="M722 416l18-22 18 22 18-22" stroke="#e7ff27" stroke-width="10" fill="none"/>

        <!-- lavender striped circles -->
        <circle cx="286" cy="112" r="32" fill="#b894ff" stroke="#111" stroke-width="4"/>
        <path d="M267 91l38 42M278 82l38 42M256 103l38 42" stroke="#fff" stroke-width="6"/>
        <circle cx="514" cy="685" r="34" fill="#b894ff" stroke="#111" stroke-width="4"/>
        <path d="M494 662l40 45M505 655l40 45M483 674l40 45" stroke="#fff" stroke-width="6"/>
      </g>
    </pattern>
  </defs>
  <rect width="800" height="800" fill="url(#memphis)"/>
</svg>
